name: Build Overlay (Windows)

# 桌面悬浮组件（overlay/sc2-overlay.exe）的自动构建流水线，全程公开透明：
#   1. 公开的 GitHub Actions 里完成 gofmt / go vet / 图标映射一致性检查 / 编译；
#   2. 对产物做真实冒烟测试（启动进程、探测 127.0.0.1:18760/health）；
#   3. 产物连同 sha256 校验信息提交回仓库 download/ 目录，
#      由 GitHub Pages 直接提供稳定下载链接（与 wasm 产物回仓同一约定）。

on:
  push:
    branches: ["main"]
    paths:
      - "overlay/**"
      - "scripts/gen-overlay-icons.py"
      - ".github/workflows/build-overlay.yml"
  pull_request:
    paths:
      - "overlay/**"
      - "scripts/gen-overlay-icons.py"
      - ".github/workflows/build-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Python (icon pipeline check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify icon mapping consistency
        id: iconcheck
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --quiet pillow
          set -o pipefail
          python scripts/gen-overlay-icons.py --check 2>&1 | tee icon-check.log
          st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then
            mkdir -p download
            cp icon-check.log download/icon-check.log
          fi
          exit $st

      - name: Verify gofmt
        run: |
          dirty=$(gofmt -l .)
          if [ -n "$dirty" ]; then
            echo "需要 gofmt 的文件: $dirty"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (desktop,production)
        run: go build -trimpath -tags desktop,production -o sc2-overlay.exe .

      # 真实冒烟：启动进程，探测本地服务与 WebView2 页面是否就绪。
      # CI 桌面会话差异导致的偶发失败不阻塞流水线，但会在结果里可见（⚠️）。
      - name: Smoke test (start + probe /health)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\sc2-overlay.exe" -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18760/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if ($ok) {
            Write-Host "冒烟通过：/health 200"
            Write-Host $r.Content
          } else {
            Write-Host "冒烟失败：/health 20s 内未就绪（CI 桌面会话差异，见上方日志）"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Publish to download/ (exe + sha256)
        if: github.event_name == 'push'
        run: |
          mkdir -p ../download
          cp sc2-overlay.exe ../download/sc2-overlay.exe
          [ -f icon-check.log ] && cp icon-check.log ../download/icon-check.log || true
          {
            echo "build: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "commit: ${GITHUB_SHA}"
            echo "sha256: $(sha256sum sc2-overlay.exe | cut -d' ' -f1)"
          } > ../download/sc2-overlay.txt

      - name: Commit artifact
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): build sc2-overlay.exe"
          file_pattern: "download/*"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc2-overlay-windows
          path: overlay/sc2-overlay.exe
          if-no-files-found: error

      - name: Gate on icon check
        if: steps.iconcheck.outcome == 'failure'
        run: |
          cat icon-check.log 2>/dev/null || true
          exit 1
